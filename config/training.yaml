# Science Reward Model Training Configuration
# Uses Hydra for config management

# Model configuration
model:
  name: "Qwen/Qwen3-4B"
  # num_labels=3 for the 3 scoring dimensions (novelty, feasibility, probability)
  num_labels: 3

# LoRA configuration (via PEFT)
# Set lora_rank to 0 to use full parameter training (no LoRA).
# Any positive value enables LoRA with that rank.
lora:
  lora_rank: 0
  lora_alpha: 16
  lora_dropout: 0.05
  target_modules:
    - "q_proj"
    - "v_proj"

# Whether to save the model after training
save_model: true

# Data configuration
# eval_file can be a single path (string) or a mapping of name → path for multiple
# eval datasets. Examples:
#   eval_file: "data/processed/built_extra_test.csv"          # single eval set
#   eval_file:                                                 # multiple eval sets
#     extra_test: "data/processed/built_extra_test.csv"
#     holdout: "data/processed/built_holdout.csv"
data:
  train_file: "data/processed_biology/built_train.csv"
  eval_file: null  # auto-discovers built_ID_test_*.csv and built_OOD_test_*.csv from the same folder

# Dimension configuration
# Each comparison is rated on 3 dimensions; weights control their contribution to the final loss.
# Setting a weight to 0 effectively ignores that dimension.
dimensions:
  names:
    - "novelty"
    - "feasibility"
    - "probability"
  weights:
    - 1.0
    - 1.0
    - 1.0
  # Whether to use the absolute score difference as a margin in the BT loss.
  # When true, the model is encouraged to predict a gap proportional to the human rating gap.

  use_margins: true
  margin_weight: 0.1

# Training arguments (maps to RewardConfig / TrainingArguments)
# Check out TRL's RewardConfig or Transformers' TrainingArguments for more options.
training:
  output_dir: "outputs/science_reward_model"
  learning_rate: 1.0e-5
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.05
  run_name: "margin_0.1" 
  per_device_train_batch_size: 8
  per_device_eval_batch_size: 8
  gradient_accumulation_steps: 2
  num_train_epochs: 1
  logging_steps: 10
  eval_strategy: "steps"
  eval_steps: 10
  save_strategy: "no"    # do not save until the end of the training
  gradient_checkpointing: true
  bf16: true
  max_length: 2048
  disable_dropout: true
  center_rewards_coefficient: null
  pad_to_multiple_of: null
  dataset_num_proc: 4
  remove_unused_columns: true
  # related to pushing to huggingface hub
  push_to_hub: false
  hub_model_id: null
  hub_token: null  # default to HF_TOKEN
  hub_private_repo: true
  # Wandb logging
  report_to: "wandb"

wandb:
  project: "science-reward-model"
